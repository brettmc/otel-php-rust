[package]
name = "otel"
version = "0.17.0"
edition = "2024"
publish = false
build = "build.rs"

[features]
test = []

[lib]
name = "otel"
crate-type = ["cdylib"]

[profile.release]
strip = "debuginfo"

[dependencies]
phper = "0.17.0"
opentelemetry = { version = "0.33.1", features = ["internal-logs"] }
opentelemetry-http = "0.33.1"
opentelemetry-stdout = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["testing"] }
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic", "tls-ring"] }
opentelemetry-semantic-conventions = "0.33.1"
tokio = { version = "1.53.3", features = ["full"] }
once_cell = "1.20.3"
anyhow = "1.0.95"
chrono = "0.4.39"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
dotenvy = "0.15.7"
hostname = "0.4.1"
regex = "1.11.1"

[build-dependencies]
cargo_metadata = "0.23.1"
phper-sys = "0.15.3"

[dev-dependencies]
phper-test = "0.16.0"
